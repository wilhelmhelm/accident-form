<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИТЕКО · Учёт ДТП</title>
<style>
:root{--brand:#006c4f;--brand-d:#004d38;--accent:#00875f;--light:#8fd3b6;--bg:#eef3f1;--card:#fff;--ink:#1b2430;--mut:#667385;--line:#d7dde6;--err:#c62828;--ok:#1b7f4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 24px;height:72px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--light)}
.logo{height:62px;display:block}
header span{opacity:.8}
header nav{margin-left:auto;display:flex;gap:4px}
header button{background:none;border:0;color:#fff;padding:8px 14px;font:inherit;cursor:pointer;border-radius:4px;opacity:.75}
header button.on{background:rgba(255,255,255,.16);opacity:1}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:24px;max-width:1180px;margin:24px auto;padding:0 16px}
aside{position:sticky;top:96px;align-self:start}
aside a{display:block;padding:9px 12px;color:var(--ink);text-decoration:none;border-left:3px solid var(--line);font-size:14px}
aside a:hover,aside a.on{border-color:var(--accent);background:#fff;color:var(--brand-d);font-weight:600}
section.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 24px;margin-bottom:18px}
section.card h2{margin:0 0 14px;font-size:17px;color:var(--brand);padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
label i{color:var(--err);font-style:normal}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg input{width:auto;margin:0}
.seg label:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand)}
.bad input,.bad select,.bad textarea,.bad .seg{border-color:var(--err);outline:1px solid var(--err);border-radius:4px}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.hide{display:none!important}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;justify-content:flex-end;align-items:center;margin:0 -16px}
.btn{background:var(--accent);color:#fff;border:0;padding:11px 26px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--brand);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
#toast{position:fixed;right:20px;top:86px;background:var(--ok);color:#fff;padding:12px 18px;border-radius:4px;display:none;z-index:9;max-width:360px}
#toast.e{background:var(--err)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{display:none}}
</style></head><body>

 else{const ty={t:"text",d:"date",h:"time",n:"number",u:"url"}[x.t];c=`<input type="${ty}" name="${x.k}" ${x.min!=null?'min="0"':""} ${x.ph?`placeholder="${esc(x.ph)}"`:""}>`}
 return `<div class="${w}" data-k="${x.k}" data-q="${x.q?1:0}"><label>${esc(x.l)}${rq}</label>${c}${x.hint?`<div class="hint">${esc(x.hint)}</div>`:""}</div>`}
$("#sections").innerHTML=S.map(s=>`<section class="card ${s.cond?"hide":""}" id="${s.id}"><h2>${s.t}</h2>${s.note?`<p class="hint" style="margin:-4px 0 12px">${s.note}</p>`:""}<div class="grid">${s.f.map(fld).join("")}</div></section>`).join("");
$("#nav").innerHTML=S.map(s=>`<a href="#${s.id}" data-s="${s.id}" ${s.cond?'class="hide"':""}>${s.t}</a>`).join("");

const f=$("#f"), val=k=>{const e=f.elements[k];if(!e)return"";if(e.length&&e[0].type=="radio"){const c=[...e].find(r=>r.checked);return c?c.value:""}return e.value.trim()};
function cond(){S.filter(s=>s.cond).forEach(s=>{const on=val(s.cond[0])==s.cond[1];$("#"+s.id).classList.toggle("hide",!on);$(`[data-s=${s.id}]`).classList.toggle("hide",!on)});count()}
function active(){return S.filter(s=>!$("#"+s.id).classList.contains("hide")).flatMap(s=>s.f)}
function count(){const a=active().filter(x=>x.q),d=a.filter(x=>val(x.k)).length;$("#cnt").textContent=`Обязательные поля: ${d} из ${a.length}`}
f.addEventListener("input",e=>{
 if(e.target.name=="date"&&e.target.value){const d=new Date(e.target.value+"T12:00");f.elements.dow.value=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][d.getDay()]}
 e.target.closest("[data-k]")?.classList.remove("bad");cond()});
f.addEventListener("reset",()=>setTimeout(cond));
function toast(m,e){const t=$("#toast");t.textContent=m;t.className=e?"e":"";t.style.display="block";setTimeout(()=>t.style.display="none",4500)}

const KEY="iteco_dtp_log";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}};
f.addEventListener("submit",async ev=>{
 ev.preventDefault();
 const fs=active(), miss=fs.filter(x=>x.q&&!val(x.k));
 document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
 miss.forEach(x=>f.querySelector(`[data-k="${x.k}"]`).classList.add("bad"));
 if(miss.length){f.querySelector(".bad").scrollIntoView({behavior:"smooth",block:"center"});return toast("Заполните обязательные поля: "+miss.length,1)}
 const rec={sent:new Date().toLocaleString("ru-RU")};fs.forEach(x=>rec[x.k]=val(x.k));
 try{const l=load();l.push(rec);localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}
 if(API_URL){
  try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...rec,token:API_TOKEN})});toast("ДТП отправлено в таблицу")}
  catch(e){return toast("Не удалось отправить: "+e.message,1)}
 }else toast("Демо-режим: сохранено только в журнале браузера (API_URL не задан)");
 f.reset();window.scrollTo({top:0,behavior:"smooth"});
});

function showTab(n){$("#v1").classList.toggle("hide",n!=1);$("#v2").classList.toggle("hide",n!=2);$("#t1").classList.toggle("on",n==1);$("#t2").classList.toggle("on",n==2);if(n==2)journal()}
$("#t1").onclick=()=>showTab(1);$("#t2").onclick=()=>showTab(2);
const COLS=[["sent","Отправлено"],["date","Дата"],["grz","Г.Р.З."],["atp","АТП"],["fio","Водитель"],["kind","Вид ДТП"],["cat","Категория"],["guilty","Виновник"],["eng","Инженер БДД"]];
function journal(){const l=load().slice().reverse();$("#tb").innerHTML=`<tr>${COLS.map(c=>`<th>${c[1]}</th>`).join("")}</tr>`+(l.length?l.map(r=>`<tr>${COLS.map(c=>`<td>${esc(r[c[0]]||"")}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${COLS.length}">Пока пусто. Отправьте первое ДТП во вкладке «Новое ДТП».</td></tr>`)}
$("#csv").onclick=()=>{const l=load();if(!l.length)return toast("Журнал пуст",1);const ks=[...new Set(l.flatMap(Object.keys))];
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const b=new Blob(["\ufeff"+[ks.map(q).join(";"),...l.map(r=>ks.map(k=>q(r[k])).join(";"))].join("\n")],{type:"text/csv"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dtp_journal.csv";a.click()};

grz2:"В456РО197",vid2:"Полуприцеп",mark2:"Schmitz",model2:"SKO 24",dmg2s:"Повреждение ЛКП без повреждения геометрии",go2:"Да",tot2:"Нет",
date:"2026-11-08",road:"Федеральные автомобильные дороги общего пользования",toll:"Бесплатная",time:"14:30",place:"М-4 Дон, 1020 км, Воронежская обл.",region:"Воронежская область",
kind:"Столкновение 2-х ТС",cat:"2 Категория (ДТП с повреждениями)",subcat:"2.1. Ущерб нам до 100 тыс. руб., второму участнику до 100 тыс. руб.",

act:"https://example.com/act",month:"Тест",docs:"https://example.com/docs",expl:"https://example.com/expl"};
$("#tst").onclick=()=>{for(const k in TEST){const e=f.elements[k];if(!e)continue;
 if(e.length&&e[0].type=="radio"){const r=[...e].find(x=>x.value==TEST[k]);if(r){r.checked=true;r.dispatchEvent(new Event("input",{bubbles:true}))}}
 else{e.value=TEST[k];e.dispatchEvent(new Event("input",{bubbles:true}))}}cond()};
cond();
